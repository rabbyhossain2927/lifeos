name: lifeos
description: LifeOS - goals, habits, journal and daily life in one calm app.
publish_to: 'none'

# The CI build overrides this with the version you type (1.0.3) and the run number.
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  http: ^1.2.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  uuid: ^4.5.1
  open_filex: ^4.5.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
