name: Check code

# Runs on every push: finds compile errors fast (no APK).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          # Turn each error into an annotation (shown on the run page / API)
          grep -E "^\s*error •" analyze.txt | head -45 | while IFS= read -r l; do
            f=$(echo "$l" | awk -F' • ' '{print $3}' | cut -d: -f1)
            ln=$(echo "$l" | awk -F' • ' '{print $3}' | cut -d: -f2)
            msg=$(echo "$l" | awk -F' • ' '{print $2}')
            echo "::error file=$f,line=$ln::$f:$ln $msg"
          done
          if grep -qE "^\s*error •" analyze.txt; then exit 1; fi
      - name: Build every screen (catches grey-screen crashes)
        run: |
          set -o pipefail
          if ! flutter test 2>&1 | tee test.txt; then
            grep -E "^=== |Exception|Error|was thrown|\.dart:[0-9]+" test.txt | grep -v "^\s*$" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Screenshots of every screen
        if: always()
        continue-on-error: true
        run: flutter test shots/shots_test.dart --update-goldens
      - name: Save screenshots to the "screenshots" branch
        if: always()
        continue-on-error: true
        run: |
          [ -d shots/out ] || exit 0
          cd shots/out
          git init -q -b screenshots
          git config user.name "LifeOS CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Screens of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
